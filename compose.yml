name: engenharia-dados-2026-2

services:
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z   # fixe a versão; evite "latest"
    container_name: minio-datalake
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_UPDATE: "off"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      # a imagem é mínima (UBI micro) e pode não ter curl; usa o mc embutido
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  spark-jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-jupyter
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1
      PYSPARK_SUBMIT_ARGS: >-
        --master local[2] --driver-memory 1g
        --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.access.key=minioadmin
        --conf spark.hadoop.fs.s3a.secret.key=minioadmin123
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
        pyspark-shell
    mem_limit: 2g
    cpus: 2
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./scripts:/home/jovyan/scripts
      - ./data:/home/jovyan/data
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
    external: true
    name: engenharia-dados-2026-2_minio_data
